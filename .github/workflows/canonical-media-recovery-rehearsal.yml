name: Canonical Media Recovery Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-rehearsal:
    name: Rehearse canonical media recovery
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lets_flex_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rehearsal-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lets_flex_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run read-only R2 and disposable PostgreSQL recovery rehearsal
        env:
          NODE_ENV: test
          ALLOW_DATABASE_RESET: "true"
          DATABASE_URL: postgresql://postgres:rehearsal-only-postgres-password@localhost:5432/lets_flex_rehearsal
          DATABASE_SSL: "false"
          ADMIN_EMAIL: rehearsal-admin@example.com
          ADMIN_PASSWORD: rehearsal-only-application-password
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CANONICAL_REGISTRY_BUCKET_NAME: ${{ vars.R2_CANONICAL_REGISTRY_BUCKET_NAME }}
          R2_CANONICAL_REGISTRY_PREFIX: ${{ vars.R2_CANONICAL_REGISTRY_PREFIX }}
          R2_CANONICAL_REGISTRY_ACCESS_KEY_ID: ${{ secrets.R2_CANONICAL_REGISTRY_ACCESS_KEY_ID }}
          R2_CANONICAL_REGISTRY_SECRET_ACCESS_KEY: ${{ secrets.R2_CANONICAL_REGISTRY_SECRET_ACCESS_KEY }}
        run: npm run media:recovery:rehearsal
