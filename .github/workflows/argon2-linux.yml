name: Argon2 Linux compatibility

on:
  push:
  pull_request:

jobs:
  argon2:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:argon2
