name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Preflight canonical media durability
        env:
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CANONICAL_REGISTRY_BUCKET_NAME: ${{ vars.R2_CANONICAL_REGISTRY_BUCKET_NAME }}
          R2_CANONICAL_REGISTRY_PREFIX: ${{ vars.R2_CANONICAL_REGISTRY_PREFIX }}
          R2_CANONICAL_REGISTRY_ACCESS_KEY_ID: ${{ secrets.R2_CANONICAL_REGISTRY_ACCESS_KEY_ID }}
          R2_CANONICAL_REGISTRY_SECRET_ACCESS_KEY: ${{ secrets.R2_CANONICAL_REGISTRY_SECRET_ACCESS_KEY }}
        run: npm run media:durability:preflight

      - name: Prepare production
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ vars.DATABASE_SSL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PRODUCTION_DATABASE_RESET_MODE: ${{ vars.PRODUCTION_DATABASE_RESET_MODE }}
          ALLOW_PRODUCTION_DB_RESET: ${{ secrets.ALLOW_PRODUCTION_DB_RESET }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CANONICAL_REGISTRY_BUCKET_NAME: ${{ vars.R2_CANONICAL_REGISTRY_BUCKET_NAME }}
          R2_CANONICAL_REGISTRY_PREFIX: ${{ vars.R2_CANONICAL_REGISTRY_PREFIX }}
          R2_CANONICAL_REGISTRY_ACCESS_KEY_ID: ${{ secrets.R2_CANONICAL_REGISTRY_ACCESS_KEY_ID }}
          R2_CANONICAL_REGISTRY_SECRET_ACCESS_KEY: ${{ secrets.R2_CANONICAL_REGISTRY_SECRET_ACCESS_KEY }}
        run: npm run production:prepare

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent "$RENDER_DEPLOY_HOOK_URL"
